name: CI

on:
  pull_request:
  push:
    branches: [main, perf/rtx4070]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
      - name: Experimental mapping lock tests
        env:
          VICTORY_MAPPING_SHARDS: '1'
        run: cargo test --locked -p victory-gpu mapping_tests -- --test-threads=1
      - name: Release build
        run: cargo build --locked --release -p victory
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: victory-windows-x64
          path: target/release/victory.exe
          if-no-files-found: error
          retention-days: 14
